mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: MinBot-Egress
    type: http
    server: 43.156.119.18
    port: 30093
    username: REPLACE_WITH_USERNAME
    password: REPLACE_WITH_PASSWORD

proxy-groups:
  - name: MinBot-Selective
    type: select
    proxies:
      - MinBot-Egress

rule-providers:
  minbot-domains:
    type: http
    behavior: domain
    format: text
    url: http://43.156.119.18:30093/domains.list
    path: ./ruleset/minbot-domains.list
    interval: 300
    proxy: DIRECT

rules:
  - RULE-SET,minbot-domains,MinBot-Selective
  - MATCH,DIRECT
