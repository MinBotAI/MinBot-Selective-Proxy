[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minbot-selective-proxy"
version = "1.2.2"
description = "Authenticated, domain-scoped HTTP forward proxy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minbot_selective_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
